server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Subrequest nội bộ: hỏi backend xem IP hiện tại có nằm trong banned_ips không.
    # Trả 200 nếu được phép, 403 nếu bị cấm (xem api.py: _block_banned_ips + /api/security/check-ip).
    location = /_check_ip {
        internal;
        proxy_pass http://backend:8000/api/security/check-ip;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # IP bị cấm sẽ nhận thẳng trang này thay vì bất kỳ nội dung nào của site.
    error_page 403 /blocked.html;
    location = /blocked.html {
        internal;
    }

    # ── Chính sách cache ──────────────────────────────────────────────────────
    # LƯU Ý: auth_request KHÔNG kế thừa từ `location /`, mỗi location phải khai báo
    # lại — thiếu là mở đường bypass chặn IP.

    # index.html trỏ tới tên file asset đã băm, nên nó TUYỆT ĐỐI không được cache:
    # cache nó = user kẹt ở bundle cũ cho tới khi tự bấm F5.
    location = /index.html {
        auth_request /_check_ip;
        add_header Cache-Control "no-cache" always;
    }

    # Client so version.json với version nhúng trong bundle để biết đã có bản mới.
    location = /version.json {
        auth_request /_check_ip;
        add_header Cache-Control "no-store" always;
    }

    # Asset do Vite băm theo nội dung → đổi nội dung là đổi tên file, cache vĩnh viễn được.
    # try_files =404: hash cũ đã bị xoá phải trả 404 rõ ràng, tuyệt đối không rơi vào
    # fallback index.html (trình duyệt sẽ nhận HTML với Content-Type javascript → trang trắng).
    # KHÔNG dùng `always` ở hai khối dưới: `always` áp header cho MỌI mã trạng thái,
    # kể cả 404. Client hỏi một asset ngay giữa lúc deploy có thể trúng 404 — cache
    # cái 404 đó kèm immutable là trang hỏng vĩnh viễn ở máy người dùng. Bỏ `always`
    # thì nginx chỉ gắn header cho response thành công, 404 không được cache.
    location /assets/ {
        auth_request /_check_ip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Ảnh tĩnh trong public/img: tên cố định vĩnh viễn nên phải revalidate,
    # nếu không thay ảnh xong user vẫn thấy ảnh cũ rất lâu.
    location /img/ {
        auth_request /_check_ip;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location / {
        auth_request /_check_ip;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        auth_request /_check_ip;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE / streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
    }

    location /images/ {
        auth_request /_check_ip;
        proxy_pass http://backend:8000/images/;
        proxy_set_header Host $host;
    }

    location /class-docs/ {
        auth_request /_check_ip;
        proxy_pass http://backend:8000/class-docs/;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        auth_request /_check_ip;
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
    }
}
